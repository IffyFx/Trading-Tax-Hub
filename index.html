<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UK Tax Trading Hub</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #007BFF; /* Blue background */
            color: white;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .gif-container {
            margin-bottom: 20px;
        }

        .gif-container img {
            max-width: 300px;
            border-radius: 8px;
        }

        /* Pornhub-style header with clean layout */
        .header-text {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px; /* spacing between boxes */
            margin-bottom: 25px; /* space below header */
        }

        .black-box {
            display: inline-block;
            background-color: #000; /* black box */
            color: #fff !important; /* white text */
            font-family: 'Roboto', sans-serif;
            font-weight: 900;
            font-size: 32px; /* slightly smaller and clean */
            padding: 6px 15px; /* smaller padding for cleaner look */
            border-radius: 5px;
        }

        .orange-box {
            display: inline-block;
            background-color: #ff9900; /* orange box */
            color: #000 !important; /* black text */
            font-family: 'Roboto', sans-serif;
            font-weight: 900;
            font-size: 32px; /* slightly smaller and clean */
            padding: 6px 15px;
            border-radius: 5px;
        }

        .button-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-top: 20px;
        }

        .button {
            display: inline-block;
            width: 220px;
            padding: 12px;
            text-align: center;
            background-color: #ffffff;
            color: #007BFF;
            border: none;
            border-radius: 6px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            text-decoration: none;
            transition: background 0.3s ease, color 0.3s ease;
        }

        .button:hover {
            background-color: #0056b3;
            color: white;
        }
    </style>
</head>

<body>
    <!-- GIF Container -->
    <div class="gif-container">
        <img src="https://media2.giphy.com/media/v1.Y2lkPTc5MGI3NjExMjI2ZnZ2b252NDF6Mjk2dGFnYnk1NGV1b282ZnZrc2doNnA0dXppZSZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/ERIB4ws3cw17uWN4mF/giphy.gif" alt="Funny Forex GIF">
    </div>

    <!-- Header with Pornhub-style colors -->
    <div class="header-text">
        <span class="black-box">UK Tax</span>
        <span class="orange-box">Trading Hub</span>
    </div>

    <!-- Buttons for Navigation -->
    <div class="button-container">
        <a href="tax-info.html" class="button">Learn About Tax</a>
        <a href="tax-calculator.html" class="button">Go to Tax Calculator</a>
        <a href="accountant-tax.html" class="button">Personal Accountant Tax Calculator</a>
    </div>
</body>

</html>
